[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-group-rename"
version = "0.1.0"
description = "适用于 PJSK、BanG Dream! 等五位房间号固车群的 NoneBot2 改群名插件，按群启用后通过群消息自动更新或清空群名车牌"
authors = [{ name = "Felis", email = "3397152010@qq.com" }]
maintainers = [{ name = "Felis", email = "3397152010@qq.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["nonebot2", "onebot", "group-rename", "group-name"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nonebot2>=2.4.4,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot-plugin-localstore>=0.7.4,<1.0.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/Felis2026/nonebot-plugin-group-rename"
Maintainer = "https://github.com/Felis2026"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_group_rename*"]
